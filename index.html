<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under the Dome: GPISD John Carl Pogue Planetarium Community Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070f; --night:#0a0f22; --deep:#111935; --panel:#141d3d;
    --line:#27325c; --star:#eef2ff; --mist:#9aa5cf; --dim:#5d6794;
    --gold:#f4c15b; --gold-soft:#ffd98a; --cyan:#74dbe8; --rose:#f08fb0; --ember:#ff8a5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--star);font-family:'Spline Sans',sans-serif;line-height:1.6;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
  ::selection{background:var(--gold);color:var(--void)}
  a{color:inherit;text-decoration:none}
  h1{font-family:'Fraunces',serif;font-weight:600;line-height:1.03;letter-spacing:-.015em}

  /* ---------- background ---------- */
  #sky{position:fixed;inset:0;z-index:0;display:block}
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 80% at 70% -10%, rgba(116,219,232,.10), transparent 55%),
               radial-gradient(90% 60% at 10% 110%, rgba(244,193,91,.07), transparent 60%)}
  main{position:relative;z-index:2}

  /* ---------- hero ---------- */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:80px 24px;gap:6px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:clamp(.68rem,1.6vw,.82rem);
    letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);margin-bottom:26px}
  .hero h1{font-family:'Cinzel','Georgia',serif;font-weight:900;
    text-transform:uppercase;letter-spacing:4px;line-height:1.1;
    font-size:clamp(2.6rem,8vw,5.5rem);
    background:linear-gradient(135deg,
      #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    text-shadow:
      0px 1px 0px #8a641a, 0px 2px 0px #735212, 0px 3px 0px #5c410b,
      0px 4px 0px #453006, 0px 5px 0px #2e2004, 0px 8px 15px rgba(0,0,0,.8);}
  .subtitle{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.1rem,3vw,1.7rem);
    color:var(--star);margin-top:18px;max-width:24ch}
  .tagline{color:var(--mist);font-size:clamp(1rem,2.2vw,1.22rem);margin-top:18px;max-width:40ch}

  .lang{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:46px}
  .btn{font-family:'Spline Sans',sans-serif;font-weight:600;font-size:1.05rem;
    padding:16px 44px;border-radius:100px;border:1px solid transparent;cursor:pointer;
    transition:.25s;min-width:190px;letter-spacing:.01em;display:inline-flex;align-items:center;
    justify-content:center;gap:10px}
  .btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241704;
    box-shadow:0 12px 34px rgba(244,193,91,.32)}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(244,193,91,.48)}
  .btn svg{flex:none}
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="scrim"></div>

  <main>
    <section class="hero">
      <div class="eyebrow">GPISD &middot; John Carl Pogue Planetarium</div>
      <h1>Under the Dome</h1>
      <p class="subtitle">Community Night</p>
      <p class="tagline">Discover the universe right here in Grand Prairie.</p>

      <div class="lang">
        <!-- Destinations to be wired up later (English / Spanish landing pages). -->
        <a class="btn btn-gold" href="#" data-lang="en">English</a>
        <a class="btn btn-gold" href="#" data-lang="es">Spanish</a>
      </div>
    </section>
  </main>

<script>
/* ---------- lightweight starfield ---------- */
(function(){
  var c=document.getElementById('sky'), x=c.getContext('2d'), stars=[], DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    c.width=innerWidth*DPR; c.height=innerHeight*DPR;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    var n=Math.round(innerWidth*innerHeight/6500);
    stars=[];
    for(var i=0;i<n;i++){
      stars.push({
        x:Math.random()*c.width, y:Math.random()*c.height,
        r:(Math.random()*1.3+0.2)*DPR,
        a:Math.random()*0.6+0.2,
        tw:Math.random()*0.02+0.004,
        p:Math.random()*Math.PI*2,
        hue:Math.random()<0.15?'116,219,232':(Math.random()<0.2?'244,193,91':'238,242,255')
      });
    }
  }
  function draw(){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){
      var s=stars[i]; s.p+=s.tw;
      var a=s.a+Math.sin(s.p)*0.25;
      x.beginPath(); x.arc(s.x,s.y,s.r,0,Math.PI*2);
      x.fillStyle='rgba('+s.hue+','+Math.max(0,a).toFixed(2)+')'; x.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);
  resize(); draw();
})();
</script>
</body>
</html>
