<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciencia de la Tierra · Under the Dome · Noche Comunitaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;700&family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070f; --night:#0a0f22; --deep:#111935; --panel:#141d3d;
    --line:#27325c; --star:#eef2ff; --mist:#9aa5cf; --dim:#5d6794;
    --gold:#f4c15b; --gold-soft:#ffd98a; --cyan:#74dbe8; --rose:#f08fb0; --ember:#ff8a5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--star);font-family:'Spline Sans',sans-serif;line-height:1.6;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
  ::selection{background:var(--gold);color:var(--void)}
  a{color:inherit;text-decoration:none}
  h1{font-family:'Fraunces',serif;font-weight:600;line-height:1.05;letter-spacing:-.01em}

  #sky{position:fixed;inset:0;z-index:0;display:block}
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 80% at 70% -10%, rgba(116,219,232,.10), transparent 55%),
               radial-gradient(90% 60% at 10% 110%, rgba(244,193,91,.07), transparent 60%)}
  main{position:relative;z-index:2}
  .site-logo{position:absolute;top:24px;left:26px;z-index:4;height:clamp(34px,5vw,48px);width:auto;display:block}

  .wrap{max-width:900px;margin:0 auto;padding:clamp(84px,9vh,110px) 24px 90px;text-align:center}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:clamp(.7rem,1.7vw,.84rem);
    letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px}
  h1{font-size:clamp(2.6rem,8vw,4.6rem)}
  h1 .em{font-style:italic;color:var(--gold-soft)}
  .intro{color:var(--mist);max-width:52ch;margin:18px auto 0;font-size:clamp(1rem,2.2vw,1.18rem)}

  .soon{margin-top:44px;background:linear-gradient(160deg,var(--panel),var(--night));
    border:1px solid var(--line);border-radius:24px;padding:clamp(30px,6vw,54px) 28px}
  .soon .glyph{font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin-bottom:14px}
  .soon h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(1.4rem,4vw,2rem);color:var(--gold-soft)}
  .soon p{color:var(--mist);max-width:46ch;margin:12px auto 0;font-size:clamp(1rem,2.2vw,1.12rem)}

  .back{display:inline-block;margin-top:46px;font-family:'JetBrains Mono',monospace;font-size:.8rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--mist);border:1px solid var(--line);
    border-radius:100px;padding:11px 22px;transition:.25s}
  .back:hover{border-color:var(--cyan);color:var(--cyan)}
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="scrim"></div>

  <main>
    <a href="index.html"><img class="site-logo" src="images/gpisd-logo.png" alt="Grand Prairie ISD"></a>

    <div class="wrap">
      <div class="eyebrow">GPISD &middot; Noche Comunitaria</div>
      <h1>Ciencia de la <span class="em">Tierra</span></h1>
      <p class="intro">Explora nuestro planeta &mdash; su clima, el agua, las rocas y las fuerzas que dan forma al suelo bajo tus pies.</p>

      <div class="soon">
        <div class="glyph">🌎</div>
        <h2>Actividades muy pronto</h2>
        <p>Nuevas actividades prácticas de Ciencia de la Tierra están en camino. ¡Vuelve pronto para explorar!</p>
      </div>

      <a class="back" href="index.html">&larr; Inicio</a>
    </div>
  </main>

<script>
(function(){
  var c=document.getElementById('sky'), x=c.getContext('2d'), stars=[], DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    c.width=innerWidth*DPR; c.height=innerHeight*DPR;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    var n=Math.round(innerWidth*innerHeight/6500); stars=[];
    for(var i=0;i<n;i++){stars.push({x:Math.random()*c.width,y:Math.random()*c.height,
      r:(Math.random()*1.3+0.2)*DPR,a:Math.random()*0.6+0.2,tw:Math.random()*0.02+0.004,p:Math.random()*Math.PI*2,
      hue:Math.random()<0.15?'116,219,232':(Math.random()<0.2?'244,193,91':'238,242,255')});}
  }
  function draw(){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){var s=stars[i]; s.p+=s.tw; var a=s.a+Math.sin(s.p)*0.25;
      x.beginPath(); x.arc(s.x,s.y,s.r,0,Math.PI*2);
      x.fillStyle='rgba('+s.hue+','+Math.max(0,a).toFixed(2)+')'; x.fill();}
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize); resize(); draw();
})();
</script>
</body>
</html>
